<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Smooth Left-to-Right Deep Navy to Electric Blue Gradient for Fixed Hero Panel -->
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d21" />
      <stop offset="35%" stop-color="#08216b" />
      <stop offset="75%" stop-color="#0f5fc2" />
      <stop offset="100%" stop-color="#147eea" />
    </linearGradient>

    <!-- Layer 1 Wave Gradient: Deep Navy fading downwards into transparent canvas -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08216b" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#0f5fc2" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#08216b" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="waveLine1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08216b" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#0f5fc2" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#08216b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Layer 2 Wave Gradient: Electric Blue fading downwards into transparent canvas -->
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f5fc2" stop-opacity="0.4" />
      <stop offset="55%" stop-color="#147eea" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#147eea" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="waveLine2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f5fc2" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f5fc2" stop-opacity="0.5" />
    </linearGradient>

    <!-- Layer 3 Wave Gradient: Cyan Accent fading downwards into transparent canvas -->
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="waveLine3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <style>
    @keyframes waveFlow1 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-900px); }
    }
    @keyframes waveFlow2 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-900px); }
    }
    @keyframes waveFlow3 {
      0% { transform: translateX(0); }
      100% { transform: translateX(-900px); }
    }
    .wave-layer-1 {
      animation: waveFlow1 17s linear infinite;
    }
    .wave-layer-2 {
      animation: waveFlow2 13s linear infinite;
    }
    .wave-layer-3 {
      animation: waveFlow3 15s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .wave-layer-1, .wave-layer-2, .wave-layer-3 {
        animation: none !important;
        transform: none !important;
      }
    }
  </style>

  <!-- Independent Flowing Waves in Lower Transparent Canvas Region (Below Fixed Panel) -->
  <g class="independent-waves">
    <!-- Wave 1: Deep Navy / Blue (Slow 17s) -->
    <g class="wave-layer-1">
      <path d="M 0,158 C 120,172 330,172 450,158 C 570,144 780,144 900,158 C 1020,172 1230,172 1350,158 C 1470,144 1680,144 1800,158 L 1800,220 L 0,220 Z" fill="url(#waveGrad1)" />
      <path d="M 0,158 C 120,172 330,172 450,158 C 570,144 780,144 900,158 C 1020,172 1230,172 1350,158 C 1470,144 1680,144 1800,158" stroke="url(#waveLine1)" stroke-width="1.2" fill="none" />
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="17s" repeatCount="indefinite" />
    </g>

    <!-- Wave 2: Electric Blue (Medium 13s) -->
    <g class="wave-layer-2">
      <path d="M 0,164 C 75,152 150,152 225,164 C 300,176 375,176 450,164 C 525,152 600,152 675,164 C 750,176 825,176 900,164 C 975,152 1050,152 1125,164 C 1200,176 1275,176 1350,164 C 1425,152 1500,152 1575,164 C 1650,176 1725,176 1800,164 L 1800,220 L 0,220 Z" fill="url(#waveGrad2)" />
      <path d="M 0,164 C 75,152 150,152 225,164 C 300,176 375,176 450,164 C 525,152 600,152 675,164 C 750,176 825,176 900,164 C 975,152 1050,152 1125,164 C 1200,176 1275,176 1350,164 C 1425,152 1500,152 1575,164 C 1650,176 1725,176 1800,164" stroke="url(#waveLine2)" stroke-width="1.4" fill="none" />
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="13s" repeatCount="indefinite" />
    </g>

    <!-- Wave 3: Cyan Accent (Foreground Ripple 15s) -->
    <g class="wave-layer-3">
      <path d="M 0,172 C 130,160 320,160 450,172 C 580,184 770,184 900,172 C 1030,160 1220,160 1350,172 C 1480,184 1670,184 1800,172 L 1800,220 L 0,220 Z" fill="url(#waveGrad3)" />
      <path d="M 0,172 C 130,160 320,160 450,172 C 580,184 770,184 900,172 C 1030,160 1220,160 1350,172 C 1480,184 1670,184 1800,172" stroke="url(#waveLine3)" stroke-width="1.6" fill="none" />
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="15s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- Fixed Blue Hero Rectangle (Bounded, Solid Panel on Top) -->
  <rect x="0" y="0" width="900" height="148" rx="8" fill="url(#heroGrad)" />

  <!-- Centered Identity & Typography (Completely Static Inside Hero Panel) -->
  <!-- Dominant Name -->
  <text x="450" y="70" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="0.05em">
    SIDDHANT PATIL
  </text>

  <!-- Subtitle directly beneath -->
  <text x="450" y="106" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#d0eaff" letter-spacing="0.04em">
    AI &amp; DATA SCIENCE @ PICT &apos;28 &#160;|&#160; CGPA 8.99
  </text>
</svg>
