<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="100%" height="190" fill="none">
  <defs>
    <!-- Smooth Left-to-Right Deep Navy to Electric Blue Gradient -->
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d21" />
      <stop offset="35%" stop-color="#08216b" />
      <stop offset="75%" stop-color="#0f5fc2" />
      <stop offset="100%" stop-color="#147eea" />
    </linearGradient>

    <!-- Translucent Wave Accent Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.08" />
    </linearGradient>

    <linearGradient id="waveLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.3" />
    </linearGradient>

    <!-- Clip path to keep flowing wave inside rounded banner boundary -->
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="900" height="190" rx="8" />
    </clipPath>
  </defs>

  <style>
    @keyframes waveFlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-900px); }
    }
    .wave-motion {
      animation: waveFlow 12s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .wave-motion {
        animation: none;
      }
    }
  </style>

  <!-- Primary Gradient Background with subtle rounded corners -->
  <rect x="0" y="0" width="900" height="190" rx="8" fill="url(#heroGrad)" />

  <!-- Flowing Wave Group clipped to banner boundary -->
  <g clip-path="url(#bannerClip)">
    <g class="wave-motion">
      <!-- Continuous seamless periodic wave fill -->
      <path d="M 0,160 C 125,175 325,175 450,160 C 575,145 775,145 900,160 C 1025,175 1225,175 1350,160 C 1475,145 1675,145 1800,160 L 1800,190 L 0,190 Z" fill="url(#waveGrad)" />
      <!-- Continuous seamless thin accent stroke line -->
      <path d="M 0,160 C 125,175 325,175 450,160 C 575,145 775,145 900,160 C 1025,175 1225,175 1350,160 C 1475,145 1675,145 1800,160" stroke="url(#waveLine)" stroke-width="1.2" fill="none" />
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="12s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- Centered Identity & Typography (Completely Static) -->
  <!-- Dominant Name -->
  <text x="450" y="86" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="0.05em">
    SIDDHANT PATIL
  </text>

  <!-- Subtitle directly beneath -->
  <text x="450" y="122" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#d0eaff" letter-spacing="0.04em">
    AI &amp; DATA SCIENCE @ PICT &apos;28 &#160;|&#160; CGPA 8.99
  </text>
</svg>
