<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 148" width="100%" height="148" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#141a24" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>
    <pattern id="gridDots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" fill-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="898" height="146" rx="8" fill="url(#bgGrad)" stroke="#262c36" stroke-width="1" />

  <!-- Subtle Dot Grid Background -->
  <rect x="2" y="2" width="896" height="144" rx="7" fill="url(#gridDots)" />

  <!-- Corner Crosshair Accents -->
  <g stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.45">
    <!-- Top-left -->
    <line x1="18" y1="18" x2="30" y2="18" />
    <line x1="18" y1="18" x2="18" y2="30" />
    <!-- Top-right -->
    <line x1="882" y1="18" x2="870" y2="18" />
    <line x1="882" y1="18" x2="882" y2="30" />
    <!-- Bottom-left -->
    <line x1="18" y1="130" x2="30" y2="130" />
    <line x1="18" y1="130" x2="18" y2="118" />
    <!-- Bottom-right -->
    <line x1="882" y1="130" x2="870" y2="130" />
    <line x1="882" y1="130" x2="882" y2="118" />
  </g>

  <!-- Top Subtle Cyan Glow Accent Line -->
  <line x1="220" y1="1" x2="680" y2="1" stroke="url(#cyanLine)" stroke-width="2" />

  <!-- Center Identity & Typography -->
  <g text-anchor="middle">
    <!-- Name -->
    <text x="450" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#f0f6fc" letter-spacing="0.06em">
      SIDDHANT PATIL
    </text>

    <!-- Subtitle / Education -->
    <text x="450" y="80" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" font-weight="600" fill="#38bdf8" letter-spacing="0.08em">
      AI &amp; DATA SCIENCE @ PICT &apos;28 &nbsp;&bull;&nbsp; CGPA 8.99
    </text>

    <!-- Dividing Hairline Accent -->
    <line x1="340" y1="96" x2="560" y2="96" stroke="url(#cyanLine)" stroke-width="1" />

    <!-- Technical Areas -->
    <text x="450" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" fill="#8b949e" letter-spacing="0.12em">
      AI/ML &bull; RAG &bull; COMPUTER VISION &bull; CYBERSECURITY
    </text>
  </g>
</svg>
