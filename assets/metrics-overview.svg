<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="130" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="metricBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="35%" stop-color="#00f5d4" stop-opacity="0.6" />
      <stop offset="65%" stop-color="#00c2ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="cyanNum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>
    <linearGradient id="blueNum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="purpleNum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="greenNum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <style>
    .metric-val {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .metric-lbl {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .metric-sub {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 10.5px;
      color: #94a3b8;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="896" height="126" rx="12" fill="url(#cardBg)" stroke="url(#metricBorder)" stroke-width="1.2" />

  <!-- Column 1: Production LOC -->
  <g transform="translate(36, 24)">
    <text class="metric-val" x="0" y="36" fill="url(#cyanNum)" font-size="34">27.4k+</text>
    <text class="metric-lbl" x="0" y="60" fill="#a7f3d0">PRODUCTION LOC</text>
    <text class="metric-sub" x="0" y="78" fill="#64748b">19 Subsystems (MEMORA)</text>
  </g>

  <!-- Separator 1 -->
  <line x1="228" y1="25" x2="228" y2="105" stroke="#1e293b" stroke-width="1" />

  <!-- Column 2: Test Suite Rigor -->
  <g transform="translate(254, 24)">
    <text class="metric-val" x="0" y="36" fill="url(#blueNum)" font-size="34">1,000+</text>
    <text class="metric-lbl" x="0" y="60" fill="#7dd3fc">AUTOMATED TESTS</text>
    <text class="metric-sub" x="0" y="78" fill="#64748b">100% Passing in CI Matrix</text>
  </g>

  <!-- Separator 2 -->
  <line x1="450" y1="25" x2="450" y2="105" stroke="#1e293b" stroke-width="1" />

  <!-- Column 3: Federated Cohort -->
  <g transform="translate(476, 24)">
    <text class="metric-val" x="0" y="36" fill="url(#purpleNum)" font-size="34">1,350+</text>
    <text class="metric-lbl" x="0" y="60" fill="#d8b4fe">CLINICAL MRI SCANS</text>
    <text class="metric-sub" x="0" y="78" fill="#64748b">BraTS-GLI 4 Hospital Silos</text>
  </g>

  <!-- Separator 3 -->
  <line x1="672" y1="25" x2="672" y2="105" stroke="#1e293b" stroke-width="1" />

  <!-- Column 4: Differential Privacy Guarantee -->
  <g transform="translate(698, 24)">
    <text class="metric-val" x="0" y="36" fill="url(#greenNum)" font-size="34">ε = 2.89</text>
    <text class="metric-lbl" x="0" y="60" fill="#6ee7b7">PROVABLE PRIVACY</text>
    <text class="metric-sub" x="0" y="78" fill="#64748b">Rényi DP at δ = 10⁻⁵</text>
  </g>
</svg>
